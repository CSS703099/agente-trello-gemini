name: Testes das ferramentas Trello
on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]
  pull_request:
    branches: [main]
    paths-ignore: ["**/*.md"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # A suíte usa apenas biblioteca padrão e o fuso do runner Linux.
      # Não instala ADK nem chama Gemini ou Trello.
      - name: Testar ferramentas com quadro simulado
        run: python -m unittest discover -s tests -v
